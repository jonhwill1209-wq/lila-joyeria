<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      lang="es">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Carrito - Lila Joyería</title>

    <link rel="stylesheet"
          href="#{request.contextPath}/css/estilos.css" />

    <style>
        .ayuda-carrito {
            margin-bottom: 20px;
            color: #665264;
            text-align: center;
        }

        .stock-carrito {
            margin-top: 8px;
            font-size: 12px;
            color: #665264;
        }

        .boton-eliminar,
        .boton-secundario {
            padding: 10px 16px;
            border: 1px solid #4A2545;
            border-radius: 4px;
            background-color: white;
            color: #4A2545;
            font: inherit;
            cursor: pointer;
        }

        .boton-eliminar:hover,
        .boton-secundario:hover {
            background-color: #F6EAF4;
        }

        .mensajes-jsf {
            list-style: none;
            padding: 0;
        }

        .acciones-catalogo {
            margin-top: 30px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .resumen-carrito {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</h:head>

<h:body>

    <header class="encabezado">
        <div class="contenedor">
            <h1>Lila Joyería</h1>

            <nav class="menu">
                <a href="#{request.contextPath}/index.jsp">Inicio</a>

                <h:link value="Catálogo" outcome="catalogo" />

                <h:link value="Login"
                        outcome="login"
                        rendered="#{not authBean.autenticado}" />

                <h:link value="Registro"
                        outcome="registro"
                        rendered="#{not authBean.autenticado}" />

                <h:link value="Carrito" outcome="carrito" />
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <section class="carrito-seccion">

            <h2>Mi carrito</h2>

            <h:form id="carritoForm">

                <h:panelGroup id="mensajes" layout="block">
                    <h:messages showSummary="false"
                                showDetail="true"
                                styleClass="mensajes-jsf"
                                errorClass="mensaje-error"
                                infoClass="mensaje-exito" />
                </h:panelGroup>

                <h:panelGroup id="contenido" layout="block">

                    <h:panelGroup layout="block"
                                  styleClass="mensaje-info"
                                  rendered="#{empty carritoBean.carrito.detalles}">
                        El carrito está vacío.
                    </h:panelGroup>

                    <h:panelGroup layout="block"
                                  rendered="#{not empty carritoBean.carrito.detalles}">

                        <p class="ayuda-carrito">
                            Cambia la cantidad y sal del campo para actualizarla.
                            Si la cantidad no es válida, se conserva el total anterior.
                        </p>

                        <div class="tabla-contenedor">

                            <h:dataTable id="tabla"
                                         value="#{carritoBean.carrito.detalles}"
                                         var="detalle"
                                         styleClass="tabla-carrito">

                                <h:column>
                                    <f:facet name="header">
                                        Producto
                                    </f:facet>

                                    <h:outputText value="#{detalle.joya.nombre}" />
                                </h:column>

                                <h:column>
                                    <f:facet name="header">
                                        Precio
                                    </f:facet>

                                    <h:outputText value="#{detalle.precioUnitario}">
                                        <f:convertNumber type="currency"
                                                         currencySymbol="$"
                                                         minFractionDigits="2"
                                                         maxFractionDigits="2" />
                                    </h:outputText>
                                </h:column>

                                <h:column>
                                    <f:facet name="header">
                                        Cantidad
                                    </f:facet>

                                    <h:inputText id="cantidad"
                                                 value="#{carritoBean.cantidades[detalle.joya.idJoya]}"
                                                 styleClass="cantidad"
                                                 required="true"
                                                 requiredMessage="Ingresa una cantidad."
                                                 converterMessage="La cantidad debe ser un número entero.">

                                        <f:converter converterId="jakarta.faces.Integer" />

                                        <f:attribute name="stockDisponible"
                                                     value="#{detalle.joya.stock}" />

                                        <f:validator validatorId="cantidadValidator" />

                                        <f:ajax event="change"
                                                execute="@this"
                                                listener="#{carritoBean.actualizarCantidad(detalle)}"
                                                render=":carritoForm:contenido :carritoForm:resumen :carritoForm:mensajes" />
                                    </h:inputText>

                                    <div class="stock-carrito">
                                        Disponible:
                                        <h:outputText value="#{detalle.joya.stock}" />
                                    </div>
                                </h:column>

                                <h:column>
                                    <f:facet name="header">
                                        Subtotal
                                    </f:facet>

                                    <h:outputText value="#{detalle.calcularSubtotal()}">
                                        <f:convertNumber type="currency"
                                                         currencySymbol="$"
                                                         minFractionDigits="2"
                                                         maxFractionDigits="2" />
                                    </h:outputText>
                                </h:column>

                                <h:column>
                                    <f:facet name="header">
                                        Acción
                                    </f:facet>

                                    <h:commandButton value="Eliminar"
                                                     action="#{carritoBean.eliminar(detalle)}"
                                                     styleClass="boton-eliminar">

                                        <f:ajax execute="@this"
                                                render=":carritoForm:contenido :carritoForm:resumen :carritoForm:mensajes"
                                                resetValues="true" />
                                    </h:commandButton>
                                </h:column>

                            </h:dataTable>

                        </div>
                    </h:panelGroup>
                </h:panelGroup>

                <h:panelGroup id="resumen" layout="block">

                    <h:panelGroup layout="block"
                                  styleClass="resumen-carrito"
                                  rendered="#{not empty carritoBean.carrito.detalles}">

                        <h3>
                            Total:
                            <h:outputText value="#{carritoBean.total}">
                                <f:convertNumber type="currency"
                                                 currencySymbol="$"
                                                 minFractionDigits="2"
                                                 maxFractionDigits="2" />
                            </h:outputText>
                        </h3>

                        <h:commandButton value="Vaciar carrito"
                                         action="#{carritoBean.vaciarConMensaje}"
                                         styleClass="boton-secundario">

                            <f:ajax execute="@this"
                                    render=":carritoForm:contenido :carritoForm:resumen :carritoForm:mensajes"
                                    resetValues="true" />
                        </h:commandButton>

                        <h:commandButton value="Realizar pedido"
                                         action="#{pedidoBean.confirmarPedido}"
                                         styleClass="boton-formulario">

                            <f:ajax execute="@form"
                                    render=":carritoForm:contenido :carritoForm:resumen :carritoForm:mensajes" />
                        </h:commandButton>

                    </h:panelGroup>

                </h:panelGroup>

            </h:form>

            <div class="acciones-catalogo">
                <h:link value="Seguir comprando"
                        outcome="catalogo"
                        styleClass="boton" />
            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 Lila Joyería</p>
    </footer>

</h:body>
</html>
