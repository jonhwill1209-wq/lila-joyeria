<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      lang="es">

<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>Catálogo - Lila Joyería</title>

    <link rel="stylesheet"
          href="#{request.contextPath}/css/estilos.css" />
</h:head>

<h:body>

    <header class="encabezado">
        <div class="contenedor">
            <h1>Lila Joyería</h1>

            <nav class="menu">
                <a href="#{request.contextPath}/index.jsp">Inicio</a>
                <h:link value="Catálogo" outcome="catalogo" />
                <h:link value="Login"
                        outcome="login"
                        rendered="#{not authBean.autenticado}" />
                <h:link value="Registro"
                        outcome="registro"
                        rendered="#{not authBean.autenticado}" />
                <h:link value="Carrito" outcome="carrito" />
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <section class="catalogo-seccion">

            <h2>Catálogo de Joyas</h2>

            <p class="catalogo-descripcion">
                Explora nuestra colección y encuentra tu joya favorita.
            </p>

            <h:form id="catalogoForm">

                <h:panelGroup id="mensajes" layout="block">
                    <h:messages showSummary="false"
                                showDetail="true"
                                styleClass="mensajes-jsf"
                                errorClass="mensaje-error"
                                infoClass="mensaje-exito" />
                </h:panelGroup>

                <div class="barra-catalogo">

                    <div class="filtro-catalogo">
                        <h:outputLabel for="categoria"
                                       value="Filtrar por categoría" />

                        <h:selectOneMenu id="categoria"
                                         value="#{catalogoBean.categoriaSeleccionada}"
                                         converter="categoriaConverter">

                            <f:selectItem itemLabel="Todas las categorías"
                                          itemValue="#{null}"
                                          noSelectionOption="true" />

                            <f:selectItems value="#{catalogoBean.categorias}"
                                           var="categoria"
                                           itemLabel="#{categoria.nombre}"
                                           itemValue="#{categoria}" />

                            <f:ajax execute="@this"
                                    listener="#{catalogoBean.filtrarPorCategoria}"
                                    render=":catalogoForm:productos :catalogoForm:mensajes" />
                        </h:selectOneMenu>
                    </div>

                    <h:panelGroup id="estadoCarrito"
                                  layout="block"
                                  styleClass="estado-carrito">

                        <strong>Total del carrito: </strong>

                        <h:outputText value="#{carritoBean.total}">
                            <f:convertNumber type="currency"
                                             currencySymbol="$"
                                             minFractionDigits="2"
                                             maxFractionDigits="2" />
                        </h:outputText>

                        <h:link value="Ver carrito"
                                outcome="carrito"
                                styleClass="boton" />
                    </h:panelGroup>

                </div>

                <h:panelGroup id="productos" layout="block">

                    <h:panelGroup layout="block"
                                  styleClass="mensaje-info"
                                  rendered="#{empty catalogoBean.joyas}">
                        No hay joyas disponibles en esta categoría.
                    </h:panelGroup>

                    <div class="lista-productos">

                        <ui:repeat value="#{catalogoBean.joyas}"
                                   var="joya">

                            <article class="producto">

                                <h:graphicImage
                                        value="/img/productos/#{joya.imagen}"
                                        alt="#{joya.nombre}"
                                        styleClass="producto-imagen"
                                        onerror="this.style.display='none';" />

                                <h3>
                                    <h:outputText value="#{joya.nombre}" />
                                </h3>

                                <p>
                                    <h:outputText value="#{joya.descripcion}" />
                                </p>

                                <p>
                                    <strong>Categoría: </strong>
                                    <h:outputText value="#{empty joya.categoria ? 'Sin categoría' : joya.categoria.nombre}" />
                                </p>

                                <p>
                                    <strong>Material: </strong>
                                    <h:outputText value="#{joya.material}" />
                                </p>

                                <h:panelGroup layout="block"
                                              rendered="#{joya.quilates ne null}">
                                    <p>
                                        <strong>Quilates: </strong>
                                        <h:outputText value="#{joya.quilates}" />
                                    </p>
                                </h:panelGroup>

                                <p>
                                    <strong>Precio: </strong>

                                    <h:outputText value="#{joya.precio}">
                                        <f:convertNumber type="currency"
                                                         currencySymbol="$"
                                                         minFractionDigits="2"
                                                         maxFractionDigits="2" />
                                    </h:outputText>
                                </p>

                                <p>
                                    <strong>Stock: </strong>
                                    <h:outputText value="#{joya.stock}" />
                                    unidades
                                </p>

                                <h:commandButton value="Agregar al carrito"
                                                 action="#{carritoBean.agregar(joya)}"
                                                 styleClass="boton-carrito"
                                                 rendered="#{joya.stock gt 0}">

                                    <f:ajax execute="@this"
                                            render=":catalogoForm:mensajes :catalogoForm:estadoCarrito" />
                                </h:commandButton>

                                <h:panelGroup layout="block"
                                              rendered="#{joya.stock le 0}">
                                    <strong>Producto agotado</strong>
                                </h:panelGroup>

                            </article>

                        </ui:repeat>

                    </div>
                </h:panelGroup>

            </h:form>

            <div class="acciones-catalogo">
                <h:link value="Consultar detalles de una joya"
                        outcome="detalle-joya"
                        styleClass="boton" />
            </div>

            <h:form rendered="#{authBean.autenticado}">
                <div class="sesion-cliente">
                    <h:outputText value="Hola, #{authBean.usuarioActual.nombre}" />

                    <h:commandButton value="Cerrar sesión"
                                     action="#{authBean.cerrarSesion}"
                                     styleClass="boton" />
                </div>
            </h:form>

        </section>
    </main>

    <footer>
        <p>© 2026 Lila Joyería</p>
    </footer>

</h:body>
</html>
