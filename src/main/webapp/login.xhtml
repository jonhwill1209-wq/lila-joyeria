<!DOCTYPE html>
<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:pt="jakarta.faces.passthrough"
        template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Iniciar sesión</ui:define>

    <ui:define name="contenido">
        <div class="contenedor">
            <section class="formulario-seccion">

                <h2>Iniciar sesión</h2>
                <p>Ingresa tus datos para acceder a tu cuenta.</p>

                <h:form id="formLogin" styleClass="formulario">

                    <div class="grupo-formulario">
                        <h:outputLabel for="correo"
                                       value="Correo electrónico" />

                        <h:inputText id="correo"
                                     value="#{authBean.correo}"
                                     required="true"
                                     requiredMessage="Ingresa tu correo electrónico."
                                     maxlength="100"
                                     pt:type="email"
                                     pt:placeholder="ejemplo@correo.com"
                                     pt:autocomplete="email">

                            <f:validator validatorId="emailValidator" />
                        </h:inputText>
                    </div>

                    <div class="grupo-formulario">
                        <h:outputLabel for="password"
                                       value="Contraseña" />

                        <h:inputSecret id="password"
                                       value="#{authBean.password}"
                                       required="true"
                                       requiredMessage="Ingresa tu contraseña."
                                       maxlength="255"
                                       redisplay="false"
                                       pt:placeholder="Ingresa tu contraseña"
                                       pt:autocomplete="current-password" />
                    </div>

                    <h:commandButton value="Iniciar sesión"
                                     action="#{authBean.iniciarSesion}"
                                     styleClass="boton-formulario">

                        <f:ajax execute="@form"
                                render="@form :mensajes" />
                    </h:commandButton>

                    <div class="enlace-alterno">
                        ¿No tienes cuenta?
                        <h:link outcome="/registro"
                                value="Regístrate" />
                    </div>

                </h:form>

            </section>
        </div>
    </ui:define>
</ui:composition>
