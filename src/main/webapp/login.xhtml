<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Iniciar sesión</title>
</h:head>

<h:body>
    <h1>Iniciar sesión</h1>

    <h:form>
        <h:messages showDetail="true" />

        <h:panelGrid columns="2">
            <h:outputLabel for="correo" value="Correo:" />
            <h:inputText id="correo"
                         value="#{authBean.correo}"
                         required="true"
                         requiredMessage="Ingrese su correo." />

            <h:outputLabel for="password" value="Contraseña:" />
            <h:inputSecret id="password"
                           value="#{authBean.password}"
                           required="true"
                           requiredMessage="Ingrese su contraseña." />
        </h:panelGrid>

        <br />

        <h:commandButton value="Iniciar sesión"
                         action="#{authBean.iniciarSesion}" />
    </h:form>
</h:body>
</html>
