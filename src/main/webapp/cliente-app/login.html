<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Lila Joyería</title>
    <link rel="stylesheet" href="styles.css">
    <script src="login.js" defer></script>
</head>
<body>
<header class="cabecera">
    <div class="contenedor cabecera-contenido">
        <a class="marca" href="index.html">Lila Joyería</a>
        <a class="enlace" href="index.html">Volver al catálogo</a>
    </div>
</header>

<main class="contenedor">
    <section class="acceso" aria-labelledby="tituloAcceso">
        <p class="subtitulo">Mi cuenta</p>
        <h1 id="tituloAcceso">Iniciar sesión</h1>
        <p>Ingresa tus datos para acceder.</p>

        <p class="mensaje" role="status">
            El acceso estará disponible cuando se integre
            el servicio de autenticación.
        </p>

        <form id="formLogin" class="formulario-acceso">
            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="username"
                        maxlength="100"
                        required
                >
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        maxlength="255"
                        required
                >
            </div>

            <button type="submit" class="boton" disabled>
                Acceso pendiente de integración
            </button>
        </form>
    </section>
</main>
</body>
</html>
