$kind: http-request
url: "{{baseUrl}}/api/joyas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "",
      "material": "Oro",
      "precio": 10.00,
      "stock": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Campo obligatorio vacío se rechaza con 400', function () { pm.response.to.have.status(400); pm.expect(pm.response.json().exito).to.eql(false); });
    language: text/javascript
order: 4000
